<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klondike — play or watch the agents</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="brand">♠ Klondike <span class="tag">solitaire-rl</span></div>
  <div class="controls">
    <select id="variant" title="draw variant">
      <option value="draw1">Draw 1</option>
      <option value="draw3">Draw 3</option>
    </select>
    <input id="seed" type="number" placeholder="seed (random)" title="deal seed — same seed, same deal">
    <button id="newGame" class="primary" title="deal a fresh game (N)">New deal</button>
    <button id="undo" title="take back the last move (U)">Undo</button>
    <button id="hint" title="highlight a suggested move (H)">Hint</button>
    <button id="auto" title="let the heuristic finish when only safe moves remain">Auto</button>
    <button id="concede" class="danger" title="resign this deal">Concede</button>
    <button id="mute" title="toggle sound">🔊</button>
  </div>
  <div class="agent">
    <select id="agentPolicy" title="which agent watches"></select>
    <button id="agentToggle">▶ Watch</button>
    <label class="speed"><input id="agentSpeed" type="range" min="80" max="1200" step="20" value="320" title="agent move delay"></label>
  </div>
</header>

<div class="statusbar">
  <span>deal <b id="stSeed">—</b></span>
  <span>moves <b id="stMoves">0</b></span>
  <span>foundations <b id="stFound">0/52</b></span>
  <span>redeals <b id="stRedeals">0</b></span>
  <span>time <b id="stTime">0:00</b></span>
  <span id="stAgent" class="agent-status"></span>
</div>

<main id="board">
  <section id="topRow">
    <div id="stock" class="pile slot" title="click to draw / redeal"></div>
    <div id="waste" class="pile"></div>
    <div class="spacer"></div>
    <div id="foundations"></div>
  </section>
  <section id="tableau"></section>
</main>

<div id="banner" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="app.js"></script>
</body>
</html>
